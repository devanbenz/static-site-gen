<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8">
    <script>
        // Apply dark mode class before any rendering to prevent flash
        (function() {
            var t = localStorage.getItem('theme');
            if (!t) t = localStorage.getItem('is_darkmode_set') === 'true' ? 'dark' : null;
            var isDark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/victor-mono@5/index.css"/>
    <link rel="stylesheet" href="/static/css/style.css"/>
    <link rel="stylesheet" href="/static/line-awesome/css/line-awesome.min.css"/>
    <script src="/static/js/main.js" defer></script>

    <!-- syntax highlighting: load both themes, disable the inactive one -->
    <link id="hljs-dark" rel="stylesheet" href="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/styles/atom-one-dark.css">
    <link id="hljs-light" rel="stylesheet" href="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/styles/atom-one-light.css">
    <script>
        // Set correct hljs theme before paint
        (function() {
            var isDark = document.documentElement.classList.contains('dark');
            document.getElementById('hljs-dark').disabled = !isDark;
            document.getElementById('hljs-light').disabled = isDark;
        })();
    </script>
    <script src="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
    <script src="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/languages/go.min.js"></script>

    <script>hljs.highlightAll();</script>
    {% block head_extend %}{% endblock %}
</head>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<body class="bg-white dark:bg-slate-900 transition ease-in-out">
<!-- Dark mode toggle -->
<button id="darkmode-toggle"
        class="fixed top-4 right-4 z-50 p-2 rounded-full
               text-slate-500 hover:text-slate-700
               dark:text-slate-400 dark:hover:text-slate-200
               bg-slate-100 dark:bg-slate-800
               hover:bg-slate-200 dark:hover:bg-slate-700
               transition shadow-md"
        aria-label="Toggle dark mode">
    <i id="darkmode-icon-sun" class="las la-sun text-xl" style="display:none;"></i>
    <i id="darkmode-icon-moon" class="las la-moon text-xl" style="display:none;"></i>
</button>
<script>
    // Show the correct icon immediately
    (function() {
        var isDark = document.documentElement.classList.contains('dark');
        document.getElementById('darkmode-icon-sun').style.display = isDark ? 'block' : 'none';
        document.getElementById('darkmode-icon-moon').style.display = isDark ? 'none' : 'block';
    })();
</script>

<!-- Back to top -->
<button id="back-to-top"
        class="hidden fixed bottom-4 right-4 z-50 p-2 rounded-full
               text-slate-500 hover:text-slate-700
               dark:text-slate-400 dark:hover:text-slate-200
               bg-slate-100 dark:bg-slate-800
               hover:bg-slate-200 dark:hover:bg-slate-700
               transition shadow-md"
        aria-label="Back to top">
    <i class="las la-arrow-up text-xl"></i>
</button>

<section>
    {% block content %}{% endblock %}
</section>
</body>
</html>
